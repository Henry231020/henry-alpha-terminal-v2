services:
  app:
    build: .
    container_name: henry-alpha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DEX_REFRESH_MS: ${DEX_REFRESH_MS:-60000}
      HELIUS_API_KEY: ${HELIUS_API_KEY:?Set HELIUS_API_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-henryalpha}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-henryalpha}
      PGSSL: "false"
      PAPER_TRADING_ENABLED: ${PAPER_TRADING_ENABLED:-false}
      PAPER_STARTING_BALANCE_USD: ${PAPER_STARTING_BALANCE_USD:-}
      PAPER_POSITION_SIZE_USD: ${PAPER_POSITION_SIZE_USD:-}
      PAPER_STOP_LOSS_PCT: ${PAPER_STOP_LOSS_PCT:-}
      PAPER_TAKE_PROFIT_PCT: ${PAPER_TAKE_PROFIT_PCT:-}
      PAPER_TRAILING_STOP_PCT: ${PAPER_TRAILING_STOP_PCT:-}
      PAPER_DAILY_LOSS_LIMIT_USD: ${PAPER_DAILY_LOSS_LIMIT_USD:-}
      PAPER_MAX_OPEN_POSITIONS: ${PAPER_MAX_OPEN_POSITIONS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: henry-alpha-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-henryalpha}
      POSTGRES_USER: ${POSTGRES_USER:-henryalpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - henry_alpha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  henry_alpha_pgdata:
