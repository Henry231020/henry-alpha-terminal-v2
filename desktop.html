<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GMGN Remote Desktop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
#screen{position:fixed;inset:0;width:100vw;height:100vh;border:0;display:block;background:#111}
#open{position:fixed;z-index:5;top:12px;right:12px;padding:10px 14px;border:0;border-radius:6px;background:#2563eb;color:white;font:14px sans-serif;cursor:pointer}
</style>
</head>
<body>
<button id="open" onclick="document.documentElement.requestFullscreen?.();this.style.display='none'">Full screen</button>
<iframe id="screen" src="/vnc.html?autoconnect=true&resize=scale&scale=true"></iframe>
</body>
</html>
